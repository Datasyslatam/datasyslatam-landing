name: Blog — artículo para revisión

# Martes y viernes (hora de Colombia, UTC-5) el asistente redacta un artículo y abre un PR antes de las 8:00 a. m.
# Nada se publica hasta que alguien revisa y hace Merge.
# Los martes el tema es de tecnología (Fabián Florián) o analítica (Agustín Robledo); los viernes, de gestión
# (Armando José López González). Ver AREAS_BY_DAY en scripts/blog-agent/generate.mjs.
# GitHub a veces retrasa u omite ejecuciones programadas, sobre todo en punto: por eso hay dos horarios con minutos
# impares (5:17 y 6:47 a. m.) y la segunda solo trabaja si la primera no dejó artículo.
# Hasta el 30 de octubre de 2026 GitHub no había disparado ni una ejecución programada en este repositorio, así que
# el servidor del sitio (server/blog-schedule.mjs) lanza el flujo desde las 7:00 a. m. con `programado: true` si
# GitHub no lo hizo ese día.
on:
  schedule:
    - cron: "17 10 * * 2,5"
    - cron: "47 11 * * 2,5"
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema opcional. Si se deja vacío, toma el siguiente tema del calendario (scripts/blog-agent/topics.json) del área del día: martes, tecnología o analítica; viernes, gestión."
        required: false
        type: string
      programado:
        description: "Uso interno: lo marca el servidor del sitio al lanzar el artículo del día como respaldo del horario."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Solo para las ejecuciones programadas (o las del respaldo del servidor): si hoy ya hay artículo publicado o un
      # PR de artículo reciente, no se repite.
      - name: Comprobar si ya hay artículo de hoy
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PROGRAMADO: ${{ inputs.programado }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ] || [ "$PROGRAMADO" = "true" ]; then
            today=$(TZ=America/Bogota date +%F)
            recent=$(gh pr list --state all --limit 30 --json headRefName,createdAt \
              --jq '[.[] | select((.headRefName | startswith("blog/")) and ((.createdAt | fromdateiso8601) > (now - 43200)))] | length')
            if grep -qsE "^date: \"?$today" content/blog/*.md || [ "$recent" != "0" ]; then
              skip=true
              echo "Ya hay un artículo de hoy; esta ejecución no genera otro."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.guard.outputs.skip != 'true'
        run: npm ci

      # pdftotext lee las fuentes en PDF para la comprobación local de cifras (scripts/blog-agent/figures.mjs).
      - name: Instalar lector de PDF
        if: steps.guard.outputs.skip != 'true'
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Investigar y redactar el artículo
        id: article
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_TOPIC: ${{ inputs.topic }}
        run: node scripts/blog-agent/generate.mjs

      - name: Comprobar que el sitio compila con el artículo
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      # Los textos generados se pasan por variables de entorno, nunca interpolados en el script.
      - name: Abrir PR para revisión
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.article.outputs.slug }}
          TITLE: ${{ steps.article.outputs.title }}
        run: |
          branch="blog/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/blog public/blog
          git commit -m "blog: $TITLE"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Blog: $TITLE" --body-file .blog-agent/pr-body.md
